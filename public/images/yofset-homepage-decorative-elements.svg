<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1694 936" role="img" aria-labelledby="title desc">
  <title id="title">Yofset Teffera exact homepage decorative overlay</title>
  <desc id="desc">Transparent SVG overlay traced to the approved 1694 by 936 homepage reference. All decorative systems are separated into named groups.</desc>
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="27" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
    </filter>
    <filter id="brush" x="-25%" y="-60%" width="150%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.22" numOctaves="2" seed="9" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="7"/>
    </filter>
    <filter id="softPaper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="14" result="paper"/>
      <feBlend in="SourceGraphic" in2="paper" mode="soft-light"/>
    </filter>
    <style>
      .decor{pointer-events:none}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .navy{stroke:#0b1c2e}.blue{stroke:#386fa8}.gold{stroke:#c79b3a}.black{stroke:#242a31}.sand{stroke:#d8c7a3}
      .f-navy{fill:#0b1c2e}.f-blue{fill:#386fa8}.f-gold{fill:#c79b3a}.f-red{fill:#a83b30}.f-green{fill:#285f4b}.f-sand{fill:#e7ddd0}.f-black{fill:#242a31}
    </style>
  </defs>

  <!-- Transparent canvas. Place this SVG over the hero with position:absolute; inset:0; width:100%; height:100%. -->

  <g id="soft-edge-shapes" class="decor" opacity=".58">
    <path d="M0 144 C53 162 90 195 117 232 L99 299 L145 389 L127 493 L147 557 L124 696 C92 790 48 858 0 874Z" fill="#e8ddd1"/>
    <path d="M1694 727 L1642 773 L1598 833 L1618 889 L1694 916Z" fill="#e7dfd0"/>
    <path d="M1582 936 C1560 875 1572 824 1625 769 L1694 728 L1694 936Z" fill="#e9dfd0"/>
  </g>

  <g id="female-profile-left" class="decor line black" stroke-width="2.2" opacity=".9" filter="url(#rough)">
    <path d="M0 239 C42 203 89 199 122 220 C154 241 166 273 154 312 C148 330 141 344 150 355 C159 366 168 373 166 386 C164 398 151 402 142 408 C133 414 136 423 147 429 C158 435 160 444 153 452 C146 461 131 460 126 470 C121 480 131 495 143 503 C162 515 172 537 161 558 C146 586 108 606 74 598 C49 592 31 581 11 576"/>
    <path d="M137 405 C124 400 112 391 105 380" opacity=".65"/>
    <path d="M17 291 C48 265 70 249 91 252" opacity=".18"/>
  </g>

  <g id="scribble-star" class="decor line black" stroke-width="3.1" transform="translate(207 166) rotate(-8)" filter="url(#rough)">
    <path d="M0-27 L7-7 L26-17 L13 2 L31 8 L10 11 L20 31 L0 16 L-17 32 L-9 10 L-31 6 L-10-2 L-24-20 L-5-10Z"/>
    <path d="M-19-25 L15 27 M20-22 L-13 25" opacity=".72"/>
  </g>

  <g id="symbol-cluster" class="decor" transform="translate(785 170)">
    <path id="crescent" d="M72 63 C50 64 38 49 41 31 C48 47 61 54 79 47 C78 53 76 59 72 63Z" class="f-blue" filter="url(#rough)"/>
    <g id="sun" class="line gold" stroke-width="2.2" transform="translate(150 0)" filter="url(#rough)">
      <circle r="18"/><circle r="13" opacity=".45"/>
      <path d="M0-28V-40 M0 28V40 M-28 0H-40 M28 0H40 M-20-20L-29-29 M20-20L29-29 M-20 20L-29 29 M20 20L29 29"/>
    </g>
    <g id="eye" class="line navy" stroke-width="2.8" transform="translate(45 125)" filter="url(#rough)">
      <path d="M-28 0 Q0-21 28 0 Q0 21-28 0Z"/><circle r="8" class="f-gold" stroke="none"/>
      <path d="M0-29V-21 M-14-25L-10-18 M14-25L10-18" stroke-width="2"/>
    </g>
  </g>

  <g id="flowing-wavy-lines" class="decor line gold" stroke-width="1.25" opacity=".65" transform="translate(582 402)">
    <path d="M0 15 C37-17 71 38 112 14 C154-10 183 14 213 43 C241 70 272 78 304 62"/>
    <path d="M0 48 C37 16 71 71 112 47 C154 23 183 47 213 76 C241 103 272 111 304 95"/>
    <path d="M0 81 C37 49 71 104 112 80 C154 56 183 80 213 109 C241 136 272 144 304 128"/>
  </g>

  <g id="portrait-portal" class="decor" transform="translate(1210 524)">
